services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buildx
      POSTGRES_USER: buildx
      POSTGRES_PASSWORD: buildx
    ports:
      - "5432:5432"
    volumes:
      - buildx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildx -d buildx"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  buildx_pgdata:
